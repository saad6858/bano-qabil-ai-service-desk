[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bano-qabil-ai-service-desk-python"
version = "0.2.0"
description = "Four-agent Bano Qabil AI Service Desk using CrewAI, LangChain, Gemini, Pinecone, and Google Calendar."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "crewai>=1.15,<2",
    "langchain>=1.4,<2",
    "langchain-core>=1.0,<2",
    "langchain-text-splitters>=1.0,<2",
    "langchain-google-genai>=4.4,<5",
    "pinecone>=7,<11",
    "google-api-python-client>=2.180,<3",
    "google-auth>=2.40,<3",
    "google-auth-httplib2>=0.2,<1",
    "google-auth-oauthlib>=1.2,<2",
    "pydantic-settings>=2.10,<3",
    "python-dotenv>=1.1,<2",
    "pymupdf>=1.26,<2",
    "pytest>=8.4,<9",
]

[project.scripts]
bq-service-desk = "bq_service_desk.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/bq_service_desk"]
